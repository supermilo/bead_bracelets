{% extends "base.html" %}

{% block title %}Checkout{% endblock %}

{% block content %}
<h1>Checkout</h1>

{% include "configurator/partials/build_tray.html" %}

<form method="post" action="{% url 'configurator:finalize_bracelet' %}" class="checkout-form">
    {% csrf_token %}
    <label>
        Name
        <input type="text" name="customer_name" value="{{ customer_name }}" required>
    </label>
    <label>
        Email
        <input type="email" name="customer_email" value="{{ customer_email }}" required>
    </label>
    <label>
        Phone (optional)
        <input type="text" name="customer_phone" value="{{ customer_phone }}">
    </label>
    <button type="submit">Continue to payment</button>
</form>
{% endblock %}

{% block extra_head %}
<style>
    .bracelet-circle {
        position: relative;
        width: clamp(480px, calc(480px + var(--slots, 0) * 5px), 630px);
        height: clamp(480px, calc(480px + var(--slots, 0) * 5px), 630px);
        max-width: 100%;
        margin: 16px auto;
        border-radius: 50%;
        border: 2px solid #bbb;
        display: flex;
        align-items: center;
        justify-content: center;
        --radius: clamp(105px, calc(105px + var(--slots, 0) * 5px), 255px);
    }

    .bracelet-circle--empty {
        border-style: dashed;
        border-color: #ddd;
    }

    .tray-item {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 72px;
        height: 72px;
        margin-top: -36px;
        margin-left: -36px;
        transform: rotate(var(--angle)) translate(var(--radius)) rotate(calc(-1 * var(--angle)));
        z-index: var(--z, 0);
    }

    .tray-item:hover,
    .tray-item:focus-within {
        z-index: 100;
    }

    .tray-item img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }

    .tray-item.slot-2 { width: 108px; height: 108px; margin-top: -54px; margin-left: -54px; }
    .tray-item.slot-3 { width: 144px; height: 144px; margin-top: -72px; margin-left: -72px; }
    .tray-item.slot-4 { width: 180px; height: 180px; margin-top: -90px; margin-left: -90px; }

    .tray-placeholder {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 30px;
        height: 30px;
        margin-top: -15px;
        margin-left: -15px;
        border: 1.5px dashed #ccc;
        border-radius: 50%;
        transform: rotate(var(--angle)) translate(var(--radius)) rotate(calc(-1 * var(--angle)));
    }

    .tray-item-remove {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 27px;
        height: 27px;
        line-height: 24px;
        padding: 0;
        border-radius: 50%;
        border: none;
        background: #333;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s ease;
    }

    .tray-item:hover .tray-item-remove,
    .tray-item:focus-within .tray-item-remove {
        opacity: 1;
    }

    /* Leather canvas: a linear layout (image + horizontal bead segment),
       structurally different from the circle above - beads sit at --left--
       percentages of the cord image's own width rather than at a fixed-px
       --radius around a center point, so (unlike the circle) no media-query
       repositioning is needed to keep beads inside the image as it shrinks;
       only the fixed-px bead thumbnail sizes still need a breakpoint. */
    .leather-canvas {
        position: relative;
        width: 100%;
        max-width: 630px;
        margin: 16px auto;
    }

    .leather-cord-image {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
    }

    .leather-canvas--empty .leather-cord-image {
        opacity: 0.6;
    }

    .leather-segment {
        position: absolute;
        top: 0;
        height: 100%;
    }

    .leather-bead,
    .leather-placeholder {
        position: absolute;
        top: 50%;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        z-index: var(--z, 0);
    }

    .leather-bead:hover,
    .leather-bead:focus-within {
        z-index: 100;
    }

    .leather-bead img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }

    .leather-bead.slot-2 { width: 108px; height: 108px; }
    .leather-bead.slot-3 { width: 144px; height: 144px; }
    .leather-bead.slot-4 { width: 180px; height: 180px; }

    .leather-bead:hover .tray-item-remove,
    .leather-bead:focus-within .tray-item-remove {
        opacity: 1;
    }

    .leather-placeholder {
        width: 30px;
        height: 30px;
        border: 1.5px dashed #ccc;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
    }

    .leather-canvas .tray-empty {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 4px;
        white-space: nowrap;
    }

    /* Below ~600px a 480px-minimum circle no longer fits comfortably, so
       revert to the pre-enlargement sizing instead of relying on
       max-width: 100% alone (which would shrink the circle's rendered box
       without shrinking the fixed-px --radius/bead-size values driving the
       translate() offsets, pushing beads outside the visible circle). */
    @media (max-width: 600px) {
        .bracelet-circle {
            width: clamp(320px, calc(320px + var(--slots, 0) * 3px), 420px);
            height: clamp(320px, calc(320px + var(--slots, 0) * 3px), 420px);
            --radius: clamp(70px, calc(70px + var(--slots, 0) * 3px), 170px);
        }

        .tray-item {
            width: 48px;
            height: 48px;
            margin-top: -24px;
            margin-left: -24px;
        }

        .tray-item.slot-2 { width: 72px; height: 72px; margin-top: -36px; margin-left: -36px; }
        .tray-item.slot-3 { width: 96px; height: 96px; margin-top: -48px; margin-left: -48px; }
        .tray-item.slot-4 { width: 120px; height: 120px; margin-top: -60px; margin-left: -60px; }

        .tray-placeholder {
            width: 20px;
            height: 20px;
            margin-top: -10px;
            margin-left: -10px;
        }

        .tray-item-remove {
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            line-height: 16px;
            font-size: 12px;
        }

        .leather-bead,
        .leather-placeholder {
            width: 48px;
            height: 48px;
        }

        .leather-bead.slot-2 { width: 72px; height: 72px; }
        .leather-bead.slot-3 { width: 96px; height: 96px; }
        .leather-bead.slot-4 { width: 120px; height: 120px; }
    }

    .tray-empty {
        color: #888;
        margin: 0;
        text-align: center;
        padding: 0 32px;
    }

    .tray-complete {
        color: #155724;
        background: #d4edda;
        border: 1px solid #c3e6cb;
        border-radius: 4px;
        padding: 8px 12px;
        margin: 12px 0 0;
        text-align: center;
        font-weight: 600;
    }

    .tray-summary {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-weight: 600;
    }

    .tray-error {
        color: #b00020;
        margin: 0 0 12px;
    }

    .tray-checkout-link {
        display: none;
    }

    .tray-clear-btn {
        display: none;
    }

    .checkout-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 400px;
        margin-top: 24px;
    }

    .checkout-form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-weight: 600;
    }

    .checkout-form input {
        padding: 8px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .checkout-form button {
        padding: 12px 16px;
        font-size: 1rem;
        margin-top: 8px;
    }
</style>
{% endblock %}
